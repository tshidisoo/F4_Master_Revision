<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family and Friends 4 — Practice Hub</title>
<style>
  :root{
    --red:#e2483d;
    --orange:#f2994a;
    --teal:#2fb6ad;
    --teal-dark:#1f8a83;
    --cream:#fff8ef;
    --ink:#2c2c2c;
    --green:#3aa655;
    --pink:#ef6c9b;
    --grey:#9a9a9a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    background:linear-gradient(180deg,#fff8ef 0%,#ffeede 100%);
    color:var(--ink);
    padding-bottom:60px;
  }
  .wrap{max-width:960px;margin:0 auto;padding:0 16px;}
  header.top{
    background:linear-gradient(135deg,var(--red),var(--orange));
    color:#fff;
    padding:36px 20px;
    border-radius:0 0 28px 28px;
    text-align:center;
    box-shadow:0 6px 18px rgba(226,72,61,0.3);
  }
  header.top h1{margin:0 0 6px;font-size:32px;}
  header.top p{margin:0;font-size:16px;opacity:0.95;}

  .progress-wrap{
    max-width:420px;
    margin:18px auto 0;
    background:rgba(255,255,255,0.25);
    border-radius:20px;
    height:10px;
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    background:#fff;
    border-radius:20px;
  }
  .progress-label{
    font-size:13px;
    margin-top:8px;
    opacity:0.95;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:18px;
    margin:30px 0;
  }

  .unit-card{
    background:#fff;
    border-radius:16px;
    box-shadow:0 4px 14px rgba(0,0,0,0.06);
    overflow:hidden;
    transition:box-shadow 0.15s;
  }
  .unit-card.locked{opacity:0.6;}

  .unit-card-head{
    padding:18px 20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
    user-select:none;
  }
  .unit-card.locked .unit-card-head{cursor:default;}

  .unit-num{
    width:42px;height:42px;
    border-radius:50%;
    background:var(--teal);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:16px;
    flex-shrink:0;
  }
  .unit-card.locked .unit-num{background:var(--grey);}

  .unit-title-block{flex:1;min-width:0;}
  .unit-title{font-weight:bold;font-size:16px;margin:0;}
  .unit-sub{font-size:12.5px;color:#8a7a63;margin:2px 0 0;}

  .chevron{
    font-size:14px;
    color:#aaa;
    transition:transform 0.2s;
  }
  .unit-card.open .chevron{transform:rotate(180deg);}

  .unit-card-body{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.25s ease;
  }
  .unit-card.open .unit-card-body{max-height:300px;}

  .unit-card-body-inner{
    padding:0 20px 20px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .ex-link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#fbf3e8;
    border:2px solid transparent;
    border-radius:10px;
    padding:10px 14px;
    text-decoration:none;
    color:var(--ink);
    font-size:14px;
    font-weight:bold;
    transition:border 0.15s,background 0.15s;
  }
  .ex-link:hover{border-color:var(--orange);}
  .ex-link .arrow{color:var(--orange);}
  .ex-link.review{background:#eaf7f5;}
  .ex-link.review:hover{border-color:var(--teal);}
  .ex-link.disabled{
    background:#f2f2f2;
    color:#aaa;
    cursor:default;
    pointer-events:none;
  }
  .ex-link.disabled .arrow{color:#bbb;}
  .ex-link .soon-tag{
    font-size:11px;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:#aaa;
  }

  .coming-soon-note{
    font-size:13px;
    color:#9a8a72;
    padding:0 20px 18px;
    margin:0;
  }

  .block-review-card{
    grid-column:1 / -1;
    background:linear-gradient(135deg,var(--teal),var(--teal-dark));
    border-radius:16px;
    padding:18px 22px;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    box-shadow:0 4px 14px rgba(31,138,131,0.25);
  }
  .block-review-card.locked{
    background:linear-gradient(135deg,#b9b9b9,#8f8f8f);
    box-shadow:none;
  }
  .block-review-card h3{margin:0 0 4px;font-size:17px;}
  .block-review-card p{margin:0;font-size:13px;opacity:0.9;}
  .block-review-card a.btn{
    background:#fff;
    color:var(--teal-dark);
    border:none;
    padding:10px 22px;
    font-size:14px;
    font-weight:bold;
    border-radius:30px;
    text-decoration:none;
    white-space:nowrap;
  }
  .block-review-card .badge-soon{
    background:rgba(255,255,255,0.3);
    padding:6px 16px;
    border-radius:30px;
    font-size:13px;
    font-weight:bold;
  }

  footer{
    text-align:center;
    color:#a08a6f;
    font-size:12px;
    margin-top:40px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>Family and Friends 4 📗</h1>
    <p>Practice exercises for every unit — pick a unit below to begin</p>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="progress-label" id="progress-label"></div>
  </header>

  <div class="grid" id="grid"></div>

  <footer>Family and Friends 4 · Practice Hub · Results are sent automatically to your teacher</footer>
</div>

<script>
/* ---------- UNIT DATA ----------
   Each unit tracks readiness per exercise (l12 / l34 / review) so a unit
   can appear on the hub as soon as ONE of its files exists, instead of
   waiting for all three. Titles/topics/emoji get filled in as each unit's
   source material arrives. */
const units = [
  { n:1, title:"The Food Here Is Great!", emoji:"🍝", topic:"Restaurant words & present simple vs continuous", l12:true, l34:true, review:true },
  { n:2, title:"We Had a Concert", emoji:"🎻", topic:"Concert words & past simple (was/were/-ed)", l12:true, l34:true, review:true },
  { n:3, title:"The Dinosaur Museum", emoji:"🦴", topic:"Museum words & past simple negatives/questions", l12:true, l34:true, review:true },
  { n:4, title:"Whose Jacket Is This?", emoji:"🎽", topic:"Sports words & possessive pronouns", l12:true, l34:true, review:true },
  { n:5, title:"Go Back to the Roundabout", emoji:"🚦", topic:"Direction words & have to/has to/had to", l12:true, l34:true, review:true },
  { n:6, title:"The Best Bed!", emoji:"🛏️", topic:"Describing words & comparatives/superlatives (long & irregular)", l12:true, l34:true, review:true },
  { n:7, title:"Will It Really Happen?", emoji:"🚀", topic:"Space words & the future with will/won't", l12:true, l34:true, review:true },
  { n:8, title:"How Much Time Have We Got?", emoji:"✈️", topic:"Airport words & countable/uncountable nouns", l12:true, l34:true, review:true },
  { n:9, title:"Something New to Watch!", emoji:"📺", topic:"TV words & the infinitive of purpose", l12:true, l34:true, review:true },
  { n:10, title:"I've Printed My Homework!", emoji:"🖨️", topic:"Computer words & the present perfect", l12:true, l34:true, review:true },
  { n:11, title:"Have You Ever Been...?", emoji:"🌋", topic:"Places words & the present perfect with ever", l12:true, l34:true, review:true },
  { n:12, title:"What's the Matter?", emoji:"🤒", topic:"Illness words & should/shouldn't", l12:true, l34:true, review:true },
  { n:13, title:"Coming soon", emoji:"🔜", topic:"Waiting for unit material", l12:false, l34:false, review:false },
  { n:14, title:"Coming soon", emoji:"🔜", topic:"Waiting for unit material", l12:false, l34:false, review:false },
  { n:15, title:"Coming soon", emoji:"🔜", topic:"Waiting for unit material", l12:false, l34:false, review:false },
];

/* Block reviews after every 3 units */
const blockReviews = [
  { range:"1–3", file:"units/block-review-1-3.html", ready:true, afterUnit:3 },
  { range:"4–6", file:"units/block-review-4-6.html", ready:true, afterUnit:6 },
  { range:"7–9", file:"units/block-review-7-9.html", ready:true, afterUnit:9 },
  { range:"10–12", file:"units/block-review-10-12.html", ready:false, afterUnit:12 },
  { range:"13–15", file:"units/block-review-13-15.html", ready:false, afterUnit:15 },
];

const grid = document.getElementById("grid");
const SLOT_TOTAL = units.length * 3;
let readySlots = units.reduce((sum, u) => sum + (u.l12?1:0) + (u.l34?1:0) + (u.review?1:0), 0);
let fullyReadyUnits = units.filter(u => u.l12 && u.l34 && u.review).length;

function exLink(href, label, isReady, extraClass){
  if (isReady) return `<a class="ex-link ${extraClass||''}" href="${href}">${label} <span class="arrow">→</span></a>`;
  return `<span class="ex-link disabled ${extraClass||''}">${label} <span class="soon-tag">Soon</span></span>`;
}

function unitCardHtml(u){
  const anyReady = u.l12 || u.l34 || u.review;
  const locked = !anyReady;

  const body = `<div class="unit-card-body"><div class="unit-card-body-inner">
      ${exLink(`units/unit${u.n}-lessons1-2.html`, "Lessons 1 &amp; 2", u.l12)}
      ${exLink(`units/unit${u.n}-lessons3-4.html`, "Lessons 3 &amp; 4", u.l34)}
      ${exLink(`units/unit${u.n}-lessons1-6.html`, "Unit Review — Skills Time (30 marks)", u.review, "review")}
    </div></div>`;

  return `<div class="unit-card ${locked ? 'locked' : ''}" data-unit="${u.n}">
      <div class="unit-card-head" onclick="${locked ? '' : `toggleUnit(${u.n})`}">
        <div class="unit-num">${u.n}</div>
        <div class="unit-title-block">
          <p class="unit-title">${u.emoji} ${locked ? 'Unit ' + u.n : u.title}</p>
          <p class="unit-sub">${u.topic}</p>
        </div>
        ${locked ? `<span class="badge-soon" style="background:#eee;color:#999;padding:4px 12px;border-radius:20px;font-size:12px;">Soon</span>` : `<span class="chevron">▼</span>`}
      </div>
      ${locked ? `<p class="coming-soon-note">This unit isn't built yet — send the vocabulary/grammar topics and it'll appear here.</p>` : body}
    </div>`;
}

function blockReviewHtml(b){
  if (b.ready){
    return `<div class="block-review-card">
        <div>
          <h3>📋 Block Review — Units ${b.range}</h3>
          <p>A combined review covering everything from these three units.</p>
        </div>
        <a class="btn" href="${b.file}">Start review →</a>
      </div>`;
  }
  return `<div class="block-review-card locked">
      <div>
        <h3>📋 Block Review — Units ${b.range}</h3>
        <p>Unlocks once Units ${b.range} are built.</p>
      </div>
      <span class="badge-soon">Coming soon</span>
    </div>`;
}

let html = "";
units.forEach(u => {
  html += unitCardHtml(u);
  const br = blockReviews.find(b => b.afterUnit === u.n);
  if (br) html += blockReviewHtml(br);
});
grid.innerHTML = html;

function toggleUnit(n){
  const card = document.querySelector(`.unit-card[data-unit="${n}"]`);
  if (!card) return;
  card.classList.toggle("open");
}

/* ---------- PROGRESS BAR ---------- */
const pct = Math.round((readySlots / SLOT_TOTAL) * 100);
document.getElementById("progress-bar").style.width = pct + "%";
document.getElementById("progress-label").textContent = `${fullyReadyUnits} of ${units.length} units fully ready · ${readySlots} of ${SLOT_TOTAL} exercises live (${pct}%)`;
</script>
</body>
</html>
